{% extends "base.html" %}
{% block title %}Add job · Resumeer{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Add a position</h1>
    <p class="lede">Company careers pages usually scrape cleanly. LinkedIn often blocks — paste the text if the fetch comes back thin.</p>
  </div>
</div>

{% if error %}<div class="error">{{ error }}</div>{% endif %}

<form class="panel" method="post" action="/jobs/new">
  <label for="url">Job URL</label>
  <input id="url" name="url" type="url" placeholder="https://company.com/careers/… or a LinkedIn job link" value="{{ url }}">

  <label for="notes">Notes to emphasize</label>
  <textarea id="notes" name="notes" placeholder="Must-haves, keywords, teams, or anything you want the tailored CV to lean on.">{{ notes }}</textarea>

  <label for="pasted">Pasted job text (optional override)</label>
  <textarea id="pasted" name="pasted" class="tall" placeholder="If scraping fails, paste the full posting here.">{{ pasted }}</textarea>

  <div class="btn-row" style="margin-top:1rem">
    <button class="btn" type="submit">Save job</button>
    <a class="btn secondary" href="/jobs">Cancel</a>
  </div>
</form>
{% endblock %}
