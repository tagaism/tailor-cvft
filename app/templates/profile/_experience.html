<div class="repeat">
  <div class="repeat-head"><span class="meta">Role</span><button class="ghost" type="button" data-remove>Remove</button></div>
  <div class="grid-2">
    <div>
      <label>Title</label>
      <input name="exp_title" type="text" value="{{ role.title if role else '' }}">
    </div>
    <div>
      <label>Company</label>
      <input name="exp_company" type="text" value="{{ role.company if role else '' }}">
    </div>
    <div>
      <label>Location</label>
      <input name="exp_location" type="text" value="{{ role.location if role else '' }}">
    </div>
    <div>
      <label>Start</label>
      <input name="exp_start" type="text" placeholder="Jan 2021" value="{{ role.start if role else '' }}">
    </div>
    <div>
      <label>End</label>
      <input name="exp_end" type="text" placeholder="Present" value="{{ role.end if role else '' }}">
    </div>
  </div>
  <label>Bullets (one per line)</label>
  <textarea name="exp_bullets">{% if role %}{% for bullet in role.bullets %}{{ bullet }}
{% endfor %}{% endif %}</textarea>
</div>
