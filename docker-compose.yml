services:
  web:
    build: .
    image: tailor-cvft:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      # Rewrite 127.0.0.1 → host.docker.internal for local providers only.
      LLM_IN_DOCKER: "1"
    volumes:
      - ./data:/data
      - ./app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tailor-cvft-ui:local
    ports:
      - "5173:80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
